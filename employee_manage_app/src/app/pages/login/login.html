<div class="parent">
    <div class="login-card">
        <!-- Header section -->
        <div class="login-header">
            <h4><i class="fa-solid fa-user-lock me-2"></i>Employee Login</h4>
        </div>

        <!-- Card body container -->
        <div class="card-body p-4">
            <!-- ✅ Bind the click flow to ngSubmit on the form element directly -->
            <form (ngSubmit)="onLogin($event)">
                
                <!-- Email Input -->
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <!-- Ensure name attribute is unique -->
                        <input type="email" [(ngModel)]="loginObj.email" name="userEmail" class="form-control" placeholder="Enter your email" required>
                    </div>
                </div>

                <!-- Password Block (Note: Using your bound contactNo property) -->
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <!-- Ensure name attribute is unique -->
                        <input type="password" [(ngModel)]="loginObj.contactNo" name="userPassword" class="form-control" placeholder="Enter your password" required>
                    </div>
                </div>

                <!-- Remember Me Utility -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="text-decoration-none forgot-link">Forgot Password?</a>
                </div>

                <!-- ✅ Login Button set to type="submit" -->
                <button type="submit" class="btn btn-primary w-100 btn-login">
                    <i class="fa-solid fa-right-to-bracket me-1"></i> Login
                </button>
            </form>
        </div>
    </div>
</div>
